<!-- templates/admin/logs.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervision & Entretien - Thermostat UAM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #222;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header {
            background: white; border-radius: 15px; padding: 20px 28px;
            margin-bottom: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;
        }
        .header h1 { font-size: 22px; color: #333; }
        .header p { color: #777; font-size: 13px; margin-top: 4px; }
        .refresh-badge {
            background: #eef1ff; color: #4c51bf; padding: 6px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 600;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        .card {
            background: white; border-radius: 15px; padding: 20px 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }
        .card h2 { font-size: 16px; margin-bottom: 14px; color: #333; display: flex; align-items: center; gap: 8px; }
        .agent-row, .conn-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; gap: 10px;
        }
        .agent-row:last-child, .conn-row:last-child { border-bottom: none; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .dot-on { background: #2ecc71; }
        .dot-off { background: #e74c3c; }
        .muted { color: #888; font-size: 12px; }
        .empty { color: #999; font-size: 13px; padding: 10px 0; }

        .log-toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .log-toolbar select, .log-toolbar input {
            padding: 7px 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 13px;
        }
        .log-list { max-height: 520px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 12.5px; }
        .log-entry { padding: 7px 10px; border-radius: 6px; margin-bottom: 4px; display: flex; gap: 10px; }
        .log-entry .ts { color: #999; white-space: nowrap; }
        .log-entry .src { font-weight: 700; white-space: nowrap; }
        .log-info { background: #f5f7ff; }
        .log-warning { background: #fff8e6; }
        .log-error { background: #ffefef; }
        .log-info .src { color: #4c51bf; }
        .log-warning .src { color: #b8860b; }
        .log-error .src { color: #c0392b; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>🛠️ Supervision & Entretien</h1>
            <p>Agents locaux, cartes Arduino et journal d'événements en direct</p>
        </div>
        <span class="refresh-badge" id="refreshBadge">Actualisation auto : 5s</span>
    </div>

    <div class="grid">
        <div class="card">
            <h2>📡 Agents locaux</h2>
            <div id="agentsList"><p class="empty">Chargement...</p></div>
        </div>
        <div class="card">
            <h2>🌡️ Connexions Arduino actives</h2>
            <div id="connexionsList"><p class="empty">Chargement...</p></div>
        </div>
    </div>

    <div class="card">
        <h2>📋 Journal d'événements</h2>
        <div class="log-toolbar">
            <select id="filterLevel">
                <option value="">Tous les niveaux</option>
                <option value="error">Erreurs</option>
                <option value="warning">Avertissements</option>
                <option value="info">Informations</option>
            </select>
            <select id="filterSource">
                <option value="">Toutes les sources</option>
                <option value="agent">agent</option>
                <option value="arduino">arduino</option>
                <option value="controle">controle</option>
                <option value="system">system</option>
            </select>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
                <input type="checkbox" id="autoScroll" checked> défilement auto
            </label>
        </div>
        <div class="log-list" id="logList"></div>
    </div>
</div>

<script>
function formatTs(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('fr-FR');
}

async function refreshAgents() {
    try {
        const r = await fetch('/api/admin/agents');
        const data = await r.json();
        const el = document.getElementById('agentsList');
        if (!data.agents || data.agents.length === 0) {
            el.innerHTML = '<p class="empty">Aucun agent ne s\'est encore connecté.</p>';
            return;
        }
        el.innerHTML = data.agents.map(a => `
            <div class="agent-row">
                <div>
                    <span class="dot ${a.en_ligne ? 'dot-on' : 'dot-off'}"></span>
                    <strong>${a.agent_id}</strong>
                    <div class="muted">${a.nombre_ports} port(s) détecté(s)</div>
                </div>
                <div class="muted">${a.en_ligne ? 'en ligne' : 'hors-ligne'} · il y a ${a.secondes_depuis_activite}s</div>
            </div>
        `).join('');
    } catch (e) { console.error(e); }
}

async function refreshConnexions() {
    try {
        const r = await fetch('/api/admin/connexions');
        const data = await r.json();
        const el = document.getElementById('connexionsList');
        if (!data.connexions || data.connexions.length === 0) {
            el.innerHTML = '<p class="empty">Aucune connexion Arduino active.</p>';
            return;
        }
        el.innerHTML = data.connexions.map(c => `
            <div class="conn-row">
                <div>
                    <span class="dot ${c.connecte ? 'dot-on' : 'dot-off'}"></span>
                    <strong>${c.port || '?'}</strong>
                    <div class="muted">${c.user_email || 'utilisateur inconnu'} · mode ${c.type_controleur || 'none'}</div>
                </div>
                <div class="muted">${c.temperature != null ? c.temperature.toFixed(1) + '°C / ' + c.consigne + '°C' : '—'}</div>
            </div>
        `).join('');
    } catch (e) { console.error(e); }
}

async function refreshLogs() {
    try {
        const level = document.getElementById('filterLevel').value;
        const source = document.getElementById('filterSource').value;
        const params = new URLSearchParams({limit: 300});
        if (level) params.set('level', level);
        if (source) params.set('source', source);

        const r = await fetch('/api/admin/logs?' + params.toString());
        const data = await r.json();
        const el = document.getElementById('logList');
        el.innerHTML = data.evenements.map(ev => `
            <div class="log-entry log-${ev.level}">
                <span class="ts">${formatTs(ev.timestamp)}</span>
                <span class="src">[${ev.source}]</span>
                <span>${ev.message}</span>
            </div>
        `).join('');
        if (document.getElementById('autoScroll').checked) {
            el.scrollTop = el.scrollHeight;
        }
    } catch (e) { console.error(e); }
}

function refreshAll() {
    refreshAgents();
    refreshConnexions();
    refreshLogs();
}

document.getElementById('filterLevel').addEventListener('change', refreshLogs);
document.getElementById('filterSource').addEventListener('change', refreshLogs);

refreshAll();
setInterval(refreshAll, 5000);
</script>
</body>
</html>
